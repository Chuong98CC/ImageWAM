_target_: imagewam.runtime.create_imagewam_flux2_klein

flux2_src_path: ???
flux2_model_path: ???
ae_model_path: ???
variant: klein-base-4b
qwen3_model_spec: Qwen/Qwen3-4B
qwen_context_len: 512
load_text_encoder: false
proprio_dim: null
mot_checkpoint_mixed_attn: true
mot_gqa_implementation: repeat
mot_force_flash_attention: false
pack_proprio_after_text: true
action_dit_pretrained_path: null

goal_prior_stage: stage2
goal_prior:
  num_latents: 100
  num_pose_tokens: 8
  num_layer_groups: 5
  latent_dim: 768
  inner_dim: 512
  lambda_pose: 0.3

  # --- bottleneck fixes ------------------------------------------------------
  # B2. Drop whole context columns from the Action Expert's view each step so it
  # cannot lean on a single aggregate. Pose tokens are never dropped.
  # Targets Language Instructions (-14.0 pp; discordant +1/-52 on libero_10).
  context_token_dropout: 0.05
  # Mask the whole context block for 10% of samples. The fallback state is
  # [txt | pose | action], i.e. Stage 1's prior interface. Kept low because the
  # context block is load-bearing -- removing it outright hurt on MolmoAct2, and
  # the Robot Initial States win (+11.6 pp) most likely runs through it.
  context_blackout_prob: 0.10
  # B4. Start the synthetic channel as a true no-op: zeroed values *and* a logit
  # bias, so it also takes no softmax mass. Zeroing values alone is not enough.
  # `to_value` is shared across all synthetic tokens, so zero-init would also
  # silence the pose columns that gate_pose_tokens=false keeps open. With the
  # split gate the cold start is carried by the logit bias alone (-5 suppresses
  # the context columns about 150x, and it is learnable so it can open).
  zero_init_value: false
  syn_gate_bias_init: -2.0
  # Gate the 92 context columns only. The 8 pose columns stay open, so step 0
  # reproduces Stage 1's [txt | pose | action] topology instead of running a
  # pose-conditioned prior with no pose at all -- and it matches the state B2+
  # blackout falls back to.
  gate_pose_tokens: false
  # B1. "grid" ties context latents to a coarse spatial grid so a global
  # perturbation can no longer move every latent together. Left at "free" (the
  # evaluated behaviour) until diagnostic D2 confirms the synthetic channel
  # really is the Action Expert's dominant input.
  latent_layout: free
  grid_hw: [7, 7]
  grid_window: 1

  # --- plan B: the Action Expert sees the reference image again --------------
  # The firewall stops being an architectural constraint and becomes a
  # regulariser: training samples which channels are visible, so neither is
  # reliable and the policy has to work from either. That redundancy is what
  # makes the baseline robust and what the hard firewall removed. Keeping a
  # syn-only regime means this same checkpoint can still be scored in firewall
  # mode, which is the number the thesis actually claims.
  action_sees_ref: true
  p_both: 0.55        # the deployment condition
  p_ref_only: 0.15    # breaks dependence on the synthetic channel
  p_syn_only: 0.30    # keeps firewall mode trained well enough to report

# --- PEFT-free LoRA on the video expert --------------------------------------
# `enabled: true` replaces 80 of the video expert's Linear layers with LoRALinear
# wrappers at construction (imagewam.py:642). Stage 2's branch of
# `apply_trainable_policy` then freezes the video expert's 3.876B base weights and
# trains the 23.6M adapters in their place -- see docs/flux2_architecture.md §5.2.
# The Action Expert and the three LIT aggregator modules stay fully trainable.
#
# Stage 2 is the only stage this works in: Stage 1 freezes the video expert
# wholesale, so adapters built there never move and the policy warns.
#
# WARNING: a LoRA-trained checkpoint must be saved merged. The stage-1 bridge and
# the eval loader rebuild the model WITHOUT adapters, so a run that writes
# `enabled: true, save_lora_merged: false` produces checkpoints the fail-closed
# loader rejects. The launcher sets the merge flag for you; if you enable LoRA by
# hand, set it too.
flux2_lora_config:
  enabled: false
  rank: 16          # adapter params: 11.8M @ 8, 23.6M @ 16, 47.2M @ 32, 94.4M @ 64
  alpha: 16.0       # scaling is alpha/rank; keep alpha == rank for a scaling of 1.0
  dropout: 0.0
  save_lora_merged: false
  save_trainable_only: false
  target_suffixes:
    - qkv
    - proj
    - linear1
    - linear2
    - img_mlp.0
    - img_mlp.2
    - txt_mlp.0
    - txt_mlp.2

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  num_heads: 24
  attn_head_dim: 128
  num_layers_double: 5
  num_layers_single: 20
  mlp_ratio: 4.0
  max_action_horizon: 64
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 0.5
  lambda_action: 1.0
  lambda_pose: 0.3
