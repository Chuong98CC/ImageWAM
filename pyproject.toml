[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imagewam"
version = "0.1.0"
description = "ImageWAM: Do World Action Models Really Need Video Generation, or Just Image Editing?"
requires-python = ">=3.10"
dependencies = [
  "accelerate==1.12.0",
  "av==16.0.1",
  "boto3==1.35.99",
  "datasets==3.6.0",
  "deepspeed==0.18.5",
  "einops==0.8.1",
  "gitpython==3.1.45",
  "huggingface-hub==0.30.0",
  "hydra-core==1.3.2",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "jsonlines==4.0.0",
  "modelscope==1.34.0",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "packaging==25.0",
  "pandas==2.2.3",
  "pillow==12.0.0",
  "pyarrow==23.0.0",
  "regex==2025.11.3",
  "rich==14.2.0",
  "safetensors==0.5.3",
  "termcolor==2.5.0",
  "torch==2.7.1",
  # Must stay pinned: torchcodec 0.3-0.5 are the releases built against torch
  # 2.7, but the cu128 index also carries 0.11.x (built for torch 2.11) and
  # torchcodec declares no torch dependency, so an unpinned resolve would pick
  # a wheel that cannot load against 2.7.1.
  "torchcodec==0.5",
  "torchvision==0.22.1",
  "tqdm==4.66.5",
  "transformers==4.51.3", # Use this line if using Omnigen2 or Ovis
  # "transformers==4.56.1", # Use this line if using flux
  "typing-extensions==4.15.0",
  "wandb==0.23.1",
  "h5py"
]

[project.optional-dependencies]
shared = [
  "diffusers",
  "peft",
  "timm",
  "opencv-python-headless",
  "scipy",
  "matplotlib",
  "python-dotenv",
  "torchdiffeq",
  "bitsandbytes",
  "tensorboard",
  "sentencepiece",
  "protobuf",
  "ninja",
]

dim = [
  # "mmcv-full==1.7.2",
  "setuptools<70",
  "wheel",
  "ipdb",
  "pyrallis",
  # "apex" -- the PyPI name is not NVIDIA apex; it resolves to an unrelated
  # package depending on cryptacular, which does not build, and uv locks all
  # extras, so it blocks `uv lock` for the whole project. NVIDIA apex is a git
  # install into an activated env:
  #   uv pip install -e "git+https://github.com/NVIDIA/apex#egg=apex"
]
# interndata_pretrain = [
#   "lerobot>=0.4"
# ]
# ^ no lerobot release satisfies this alongside the pins above: lerobot<=0.4.2
#   needs wandb>=0.20,<0.22 but this project pins wandb==0.23.1, and
#   lerobot>=0.5.0 needs numpy>=2.0,<2.3 but this project pins numpy==1.26.4.
#   Re-enable together with those pins, or drop this extra.
# uv pip install mmcv-full==1.7.2 --no-build-isolation

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["imagewam*"]

# ---------------------------------------------------------------------------
# uv: 把 torch / torchvision / torchcodec 指向 cu128 wheel index
# 安装命令: uv pip install -e .
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchcodec = [{ index = "pytorch-cu128" }]
